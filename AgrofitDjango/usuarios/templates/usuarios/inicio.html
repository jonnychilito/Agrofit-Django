            <!--SECCION DE INGRESO DE DATOS-->
            <form class="input_section">

                    <div class="input_place">
                        <i class="fa-regular fa-address-card input_icon"></i>
                        <input class="input_dp" type="text" id="document_number" placeholder="123456789">
                    </div>

                    <label class="password">Contraseña</label>
                    <div class="input_place">
                        <i class="fa-solid fa-lock input_icon"></i>
                        <input class="input_dp" type="password" id="password_pin" placeholder="********">
                        <i class="fa-regular fa-eye input_eye"></i>
                    </div>

                    <div class="password_recording_place">
                        <label class="remember_me">
                            <input type="checkbox" id="remember">
                            <span>Recordarme</span>
                        </label>

                        <!--<a href="clave1.html" class="forgot_password">¿Olvidó su Contraseña?</a>-->
                    </div>
                    
                    <!--BOTON DE INGRESAR AL SISTEMA-->
                    <a href="#" class="enter"><span class="enter_text">Ingresar</span><i class="fa-solid fa-arrow-right"></i>
                    </a>
